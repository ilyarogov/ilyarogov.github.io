<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Key Value Tester</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, sans-serif;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: linear-gradient(135deg, #f4f7fb, #dfe8f3);
		}

		main {
			width: min(480px, calc(100vw - 32px));
			padding: 24px;
			border-radius: 16px;
			background: #ffffff;
			box-shadow: 0 16px 40px rgba(36, 53, 77, 0.15);
		}

		h1 {
			margin-top: 0;
			font-size: 1.6rem;
		}

		p {
			color: #445268;
			line-height: 1.5;
		}

		input {
			width: 100%;
			padding: 12px 14px;
			border: 1px solid #bfd0e2;
			border-radius: 10px;
			font-size: 1rem;
			box-sizing: border-box;
		}

		.output {
			margin-top: 12px;
			padding: 10px 12px;
			border-radius: 10px;
			background: #eef4fb;
			color: #24354d;
			min-height: 1.5rem;
		}
	</style>
</head>
<body>
	<main>
		<h1>Key Value Tester</h1>
		<p>Focus the input below and press any key to show its string value under the textbox.</p>
		<input id="key-input" type="text" placeholder="Press a key here">
		<div id="key-output" class="output">Pressed key: none</div>
	</main>

	<script>
		const keyInput = document.getElementById("key-input");
		const keyOutput = document.getElementById("key-output");

		keyInput.addEventListener("keydown", (event) => {
			keyOutput.textContent = `Pressed key: ${event.key}`;
		});
	</script>
</body>
</html>
