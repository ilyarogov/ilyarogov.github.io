<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Car Environment</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
        }
        #reset-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(200, 50, 50, 0.8);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #reset-button:hover {
            background: rgba(255, 80, 80, 0.9);
        }
        #reset-button:active {
            background: rgba(150, 30, 30, 0.9);
        }
        #view-toggle {
            position: absolute;
            top: 20px;
            right: 140px;
            padding: 10px 20px;
            background: rgba(50, 100, 200, 0.8);
            color: white;
            border: 2px solid white;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #view-toggle:hover {
            background: rgba(80, 150, 255, 0.9);
        }
        #view-toggle:active {
            background: rgba(30, 70, 150, 0.9);
        }
        #controls-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 5px;
        }
        .control-button {
            width: 60px;
            height: 60px;
            background: rgba(100, 100, 100, 0.7);
            border: 2px solid white;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .control-button:active {
            background: rgba(200, 200, 200, 0.9);
        }
        #btn-forward {
            grid-column: 2;
            grid-row: 1;
        }
        #btn-left {
            grid-column: 1;
            grid-row: 2;
        }
        #btn-backward {
            grid-column: 2;
            grid-row: 2;
        }
        #btn-right {
            grid-column: 3;
            grid-row: 2;
        }
        #fps-counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 5px;
        }
        #red-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 9999;
        }
        #kill-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-family: monospace;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <strong>Controls:</strong><br>
        ↑↓ Keys or WASD: Forward/Backward<br>
        ← → Keys or AD: Left/Right<br>
        Avoid cars, buildings, trees, and pedestrians!
    </div>
    <div id="fps-counter">FPS: 0</div>
    <div id="red-flash"></div>
    <div id="kill-counter">Pedestrians Hit: 0</div>
    <button id="view-toggle">1ST PERSON</button>
    <button id="reset-button">RESET</button>
    <div id="controls-container">
        <button class="control-button" id="btn-forward">▲</button>
        <button class="control-button" id="btn-left">◄</button>
        <button class="control-button" id="btn-backward">▼</button>
        <button class="control-button" id="btn-right">►</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script>
        // Scene, Camera, Renderer
        const scene = new THREE.Scene();

        // Create background texture (forest gradient)
        const bgCanvas = document.createElement('canvas');
        bgCanvas.width = 512;
        bgCanvas.height = 512;
        const bgCtx = bgCanvas.getContext('2d');
        const gradient = bgCtx.createLinearGradient(0, 0, 0, 512);
        gradient.addColorStop(0, '#87CEEB'); // sky blue at top
        gradient.addColorStop(1, '#228B22'); // forest green at bottom
        bgCtx.fillStyle = gradient;
        bgCtx.fillRect(0, 0, 512, 512);
        scene.background = new THREE.CanvasTexture(bgCanvas);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30); // Initial camera position
        camera.position.set(0, 10, 30); // Initial camera position
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);

        // Road texture - US-style roads
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        // Gray asphalt base
        ctx.fillStyle = '#888888';
        ctx.fillRect(0, 0, 1024, 256);
        
        // Add subtle grainy texture
        for (let i = 0; i < 2000; i++) {
            const x = Math.random() * 1024;
            const y = Math.random() * 256;
            ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.08})`;
            ctx.fillRect(x, y, 2, 2);
        }
        
        // Double yellow center line - centered and proportional
        ctx.fillStyle = '#FFFF00';
        const centerY = 128;
        const lineWidth = 12;
        const lineGap = 8;
        
        // Draw dashed center lines
        for (let x = 0; x < 1024; x += 60) {
            ctx.fillRect(x, centerY - lineWidth - lineGap / 2, 40, lineWidth);
            ctx.fillRect(x, centerY + lineGap / 2, 40, lineWidth);
        }
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 1);

        // City roads - initial roads handled by chunk system
        const roadWidth = 20;
        const roadLength = 400;
        const roadMaterial = new THREE.MeshLambertMaterial({ 
            map: texture, 
            side: THREE.DoubleSide,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        // Buildings array (populated by chunk system)
        const buildings = [];
        const pedestrians = [];
        const trees = [];
        const treeGeometry = new THREE.ConeGeometry(2.5, 10, 8);
        const treeMaterial = new THREE.MeshBasicMaterial({ color: 0x228822 });

        // Chunk system for infinite procedural generation
        const CHUNK_SIZE = 100;
        const LOAD_DISTANCE = 300;
        const UNLOAD_DISTANCE = 500;
        const loadedChunks = new Map();
        const chunkObjects = new Map();

        // Seeded random number generator for procedural generation
        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function getChunkKey(chunkX, chunkZ) {
            return `${chunkX},${chunkZ}`;
        }

        function getChunkCoords(worldX, worldZ) {
            return {
                x: Math.floor(worldX / CHUNK_SIZE),
                z: Math.floor(worldZ / CHUNK_SIZE)
            };
        }

        function generateChunk(chunkX, chunkZ) {
            const chunkKey = getChunkKey(chunkX, chunkZ);
            if (loadedChunks.has(chunkKey)) return;

            const chunkOriginX = chunkX * CHUNK_SIZE;
            const chunkOriginZ = chunkZ * CHUNK_SIZE;
            const chunkGroup = new THREE.Group();
            
            const seed = chunkX * 73856093 ^ chunkZ * 19349663;
            const roadSpacing = 50;
            
            // Create single chunk ground plane with road texture
            const chunkCanvas = document.createElement('canvas');
            chunkCanvas.width = 2048;
            chunkCanvas.height = 2048;
            const chunkCtx = chunkCanvas.getContext('2d');
            
            // Ground base color
            chunkCtx.fillStyle = '#5eb877';
            chunkCtx.fillRect(0, 0, 2048, 2048);
            
            // Calculate road positions in chunk space
            const pixelsPerUnit = 2048 / (CHUNK_SIZE * 2);
            const roadWidthPixels = 20 * pixelsPerUnit;
            const cornerRadius = roadWidthPixels / 2;
            
            // Collect all road positions
            const horizontalRoadPositions = [];
            const verticalRoadPositions = [];
            
            for (let x = chunkOriginX - CHUNK_SIZE / 2; x <= chunkOriginX + CHUNK_SIZE * 1.5; x += roadSpacing) {
                const pixelX = ((x - (chunkOriginX - CHUNK_SIZE / 2)) / (CHUNK_SIZE * 2)) * 2048;
                horizontalRoadPositions.push(pixelX);
            }
            
            for (let z = chunkOriginZ - CHUNK_SIZE / 2; z <= chunkOriginZ + CHUNK_SIZE * 1.5; z += roadSpacing) {
                const pixelZ = ((z - (chunkOriginZ - CHUNK_SIZE / 2)) / (CHUNK_SIZE * 2)) * 2048;
                verticalRoadPositions.push(pixelZ);
            }
            
            // Draw gray road base
            chunkCtx.fillStyle = '#5e5e5e';
            
            // Draw all horizontal roads
            horizontalRoadPositions.forEach(pixelX => {
                chunkCtx.fillRect(0, pixelX - roadWidthPixels / 2, 2048, roadWidthPixels);
            });
            
            // Draw all vertical roads
            verticalRoadPositions.forEach(pixelZ => {
                chunkCtx.fillRect(pixelZ - roadWidthPixels / 2, 0, roadWidthPixels, 2048);
            });
            
            // Draw rounded corners at intersections
            horizontalRoadPositions.forEach(pixelX => {
                verticalRoadPositions.forEach(pixelZ => {
                    const halfRoad = roadWidthPixels / 2;
                    
                    // Draw a rounded square at the intersection
                    chunkCtx.beginPath();
                    chunkCtx.moveTo(pixelZ - halfRoad + cornerRadius, pixelX - halfRoad);
                    chunkCtx.lineTo(pixelZ + halfRoad - cornerRadius, pixelX - halfRoad);
                    chunkCtx.arcTo(pixelZ + halfRoad, pixelX - halfRoad, pixelZ + halfRoad, pixelX - halfRoad + cornerRadius, cornerRadius);
                    chunkCtx.lineTo(pixelZ + halfRoad, pixelX + halfRoad - cornerRadius);
                    chunkCtx.arcTo(pixelZ + halfRoad, pixelX + halfRoad, pixelZ + halfRoad - cornerRadius, pixelX + halfRoad, cornerRadius);
                    chunkCtx.lineTo(pixelZ - halfRoad + cornerRadius, pixelX + halfRoad);
                    chunkCtx.arcTo(pixelZ - halfRoad, pixelX + halfRoad, pixelZ - halfRoad, pixelX + halfRoad - cornerRadius, cornerRadius);
                    chunkCtx.lineTo(pixelZ - halfRoad, pixelX - halfRoad + cornerRadius);
                    chunkCtx.arcTo(pixelZ - halfRoad, pixelX - halfRoad, pixelZ - halfRoad + cornerRadius, pixelX - halfRoad, cornerRadius);
                    chunkCtx.closePath();
                    chunkCtx.fill();
                });
            });
            
            // Draw white edge lines
            chunkCtx.strokeStyle = '#FFFFFF';
            chunkCtx.lineWidth = 2;
            
            // Horizontal road edges
            horizontalRoadPositions.forEach(pixelX => {
                // Top edge
                chunkCtx.beginPath();
                chunkCtx.moveTo(0, pixelX - roadWidthPixels / 2);
                chunkCtx.lineTo(2048, pixelX - roadWidthPixels / 2);
                chunkCtx.stroke();
                
                // Bottom edge
                chunkCtx.beginPath();
                chunkCtx.moveTo(0, pixelX + roadWidthPixels / 2);
                chunkCtx.lineTo(2048, pixelX + roadWidthPixels / 2);
                chunkCtx.stroke();
            });
            
            // Vertical road edges
            verticalRoadPositions.forEach(pixelZ => {
                // Left edge
                chunkCtx.beginPath();
                chunkCtx.moveTo(pixelZ - roadWidthPixels / 2, 0);
                chunkCtx.lineTo(pixelZ - roadWidthPixels / 2, 2048);
                chunkCtx.stroke();
                
                // Right edge
                chunkCtx.beginPath();
                chunkCtx.moveTo(pixelZ + roadWidthPixels / 2, 0);
                chunkCtx.lineTo(pixelZ + roadWidthPixels / 2, 2048);
                chunkCtx.stroke();
            });
            
            // Draw dashed yellow center lines
            chunkCtx.fillStyle = '#FFFF00';
            const lineWidth = 2.5;
            const lineGap = 3;
            const dashLength = 15;
            const dashGap = 10;
            
            // Horizontal yellow dashed lines
            horizontalRoadPositions.forEach(pixelX => {
                for (let px = 0; px < 2048; px += dashLength + dashGap) {
                    chunkCtx.fillRect(px, pixelX - lineWidth - lineGap / 2, dashLength, lineWidth);
                    chunkCtx.fillRect(px, pixelX + lineGap / 2, dashLength, lineWidth);
                }
            });
            
            // Vertical yellow dashed lines
            verticalRoadPositions.forEach(pixelZ => {
                for (let py = 0; py < 2048; py += dashLength + dashGap) {
                    chunkCtx.fillRect(pixelZ - lineWidth - lineGap / 2, py, lineWidth, dashLength);
                    chunkCtx.fillRect(pixelZ + lineGap / 2, py, lineWidth, dashLength);
                }
            });
            
            // Create texture from canvas
            const chunkTexture = new THREE.CanvasTexture(chunkCanvas);
            chunkTexture.minFilter = THREE.LinearFilter;
            chunkTexture.magFilter = THREE.LinearFilter;
            chunkTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            const chunkMaterial = new THREE.MeshBasicMaterial({ 
                map: chunkTexture,
                side: THREE.DoubleSide
            });
            
            // Create single ground plane for entire chunk
            const groundGeom = new THREE.PlaneGeometry(CHUNK_SIZE * 2, CHUNK_SIZE * 2);
            const ground = new THREE.Mesh(groundGeom, chunkMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(chunkOriginX + CHUNK_SIZE / 2, 0, chunkOriginZ + CHUNK_SIZE / 2);
            chunkGroup.add(ground);
            
            // Generate buildings procedurally based on chunk seed
            const numBuildings = Math.floor(seededRandom(seed) * 4) + 2;
            const placedBuildings = []; // Track buildings in this chunk for collision detection
            
            for (let i = 0; i < numBuildings; i++) {
                const buildingSeed = seed + i;
                const localX = seededRandom(buildingSeed) * CHUNK_SIZE;
                const localZ = seededRandom(buildingSeed + 1) * CHUNK_SIZE;
                const worldX = chunkOriginX + localX;
                const worldZ = chunkOriginZ + localZ;
                
                // Skip if too close to roads
                if ((localX % roadSpacing < 10 || localX % roadSpacing > roadSpacing - 10) ||
                    (localZ % roadSpacing < 10 || localZ % roadSpacing > roadSpacing - 10)) continue;
                
                const width = seededRandom(buildingSeed + 2) * 25 + 15;
                const depth = seededRandom(buildingSeed + 3) * 25 + 15;
                const height = seededRandom(buildingSeed + 4) * 60 + 30;
                
                // Check for overlap with other buildings
                let overlaps = false;
                for (let pb of placedBuildings) {
                    const distX = Math.abs(worldX - pb.x);
                    const distZ = Math.abs(worldZ - pb.z);
                    const minDistX = (width + pb.width) / 2 + 5; // 5 unit buffer
                    const minDistZ = (depth + pb.depth) / 2 + 5;
                    
                    if (distX < minDistX && distZ < minDistZ) {
                        overlaps = true;
                        break;
                    }
                }
                
                if (overlaps) continue;
                
                // Store building data for collision checks
                placedBuildings.push({ x: worldX, z: worldZ, width: width, depth: depth });
                
                const buildingGeom = new THREE.BoxGeometry(width, height, depth);
                const buildingColor = Math.floor(seededRandom(buildingSeed + 5) * 0x888888) + 0x555555;
                const buildingMat = new THREE.MeshLambertMaterial({ color: buildingColor });
                const building = new THREE.Mesh(buildingGeom, buildingMat);
                building.position.set(worldX, height / 2, worldZ);
                chunkGroup.add(building);
                buildings.push(building);
                
                // Add windows
                const windowColor = 0xffff99;
                const windowMat = new THREE.MeshBasicMaterial({ color: windowColor });
                const windowSize = 2;
                const windowSpacing = 8;
                
                // Front and back windows
                for (let wx = -width / 2 + 4; wx < width / 2; wx += windowSpacing) {
                    for (let wy = 8; wy < height - 4; wy += windowSpacing) {
                        const windowGeom = new THREE.PlaneGeometry(windowSize, windowSize);
                        const windowMesh = new THREE.Mesh(windowGeom, windowMat);
                        windowMesh.position.set(worldX + wx, wy, worldZ + depth / 2 + 0.05);
                        chunkGroup.add(windowMesh);
                        
                        const windowGeom2 = new THREE.PlaneGeometry(windowSize, windowSize);
                        const windowMesh2 = new THREE.Mesh(windowGeom2, windowMat);
                        windowMesh2.position.set(worldX + wx, wy, worldZ - depth / 2 - 0.05);
                        chunkGroup.add(windowMesh2);
                    }
                }
                
                // Left and right windows
                for (let wz = -depth / 2 + 4; wz < depth / 2; wz += windowSpacing) {
                    for (let wy = 8; wy < height - 4; wy += windowSpacing) {
                        const windowGeom = new THREE.PlaneGeometry(windowSize, windowSize);
                        const windowMesh = new THREE.Mesh(windowGeom, windowMat);
                        windowMesh.rotation.y = Math.PI / 2;
                        windowMesh.position.set(worldX - width / 2 - 0.05, wy, worldZ + wz);
                        chunkGroup.add(windowMesh);
                        
                        const windowGeom2 = new THREE.PlaneGeometry(windowSize, windowSize);
                        const windowMesh2 = new THREE.Mesh(windowGeom2, windowMat);
                        windowMesh2.rotation.y = Math.PI / 2;
                        windowMesh2.position.set(worldX + width / 2 + 0.05, wy, worldZ + wz);
                        chunkGroup.add(windowMesh2);
                    }
                }
            }
            
            // Generate trees
            const numTrees = Math.floor(seededRandom(seed + 100) * 10) + 5;
            for (let i = 0; i < numTrees; i++) {
                const treeSeed = seed + 100 + i;
                const localX = seededRandom(treeSeed) * CHUNK_SIZE;
                const localZ = seededRandom(treeSeed + 1) * CHUNK_SIZE;
                const worldX = chunkOriginX + localX;
                const worldZ = chunkOriginZ + localZ;
                
                if ((localX % roadSpacing < 15 || localX % roadSpacing > roadSpacing - 15) ||
                    (localZ % roadSpacing < 15 || localZ % roadSpacing > roadSpacing - 15)) continue;
                
                const tree = new THREE.Mesh(treeGeometry, treeMaterial);
                tree.position.set(worldX, 5, worldZ);
                chunkGroup.add(tree);
                trees.push(tree);
            }

            // Generate pedestrians
            const numPeds = Math.floor(seededRandom(seed + 200) * 8) + 4;
            for (let i = 0; i < numPeds; i++) {
                const pedSeed = seed + 200 + i;
                const localX = seededRandom(pedSeed) * CHUNK_SIZE;
                const localZ = seededRandom(pedSeed + 1) * CHUNK_SIZE;
                const worldX = chunkOriginX + localX;
                const worldZ = chunkOriginZ + localZ;
                
                // Spawn pedestrians on sidewalks (not on roads)
                if ((localX % roadSpacing < 20 && localX % roadSpacing > -5) ||
                    (localZ % roadSpacing < 20 && localZ % roadSpacing > -5)) continue;
                
                const ped = createPedestrian();
                ped.position.set(worldX, 1.5, worldZ);
                chunkGroup.add(ped);
                
                const minX = Math.floor(localX / roadSpacing) * roadSpacing + chunkOriginX;
                const maxX = minX + roadSpacing;
                const minZ = Math.floor(localZ / roadSpacing) * roadSpacing + chunkOriginZ;
                const maxZ = minZ + roadSpacing;
                
                pedestrians.push({
                    mesh: ped,
                    speed: 0.02 + seededRandom(pedSeed + 2) * 0.03,
                    directionX: (seededRandom(pedSeed + 3) - 0.5) * 2,
                    directionZ: (seededRandom(pedSeed + 4) - 0.5) * 2,
                    minX: minX,
                    maxX: maxX,
                    minZ: minZ,
                    maxZ: maxZ
                });
            }

            // Generate AI cars
            const numChunkCars = Math.floor(seededRandom(seed + 300) * 3) + 1;
            for (let i = 0; i < numChunkCars; i++) {
                const carSeed = seed + 300 + i;
                const carColor = Math.floor(seededRandom(carSeed) * 0xffffff);
                
                // Create waypoints along roads (not diagonal)
                const waypoints = [];
                
                // Pick a starting road position
                const startRoadIdx = Math.floor(seededRandom(carSeed) * 4);
                const roads = [
                    { x: chunkOriginX - CHUNK_SIZE / 2, z: chunkOriginZ },
                    { x: chunkOriginX + CHUNK_SIZE / 2, z: chunkOriginZ },
                    { x: chunkOriginX, z: chunkOriginZ - CHUNK_SIZE / 2 },
                    { x: chunkOriginX, z: chunkOriginZ + CHUNK_SIZE / 2 }
                ];
                
                let currentPos = roads[startRoadIdx];
                waypoints.push({ x: currentPos.x, z: currentPos.z });
                
                // Skip if starting position is too close to player spawn (0, 0)
                const distToOrigin = Math.sqrt(currentPos.x * currentPos.x + currentPos.z * currentPos.z);
                if (distToOrigin < 30) {
                    continue; // Skip this AI car
                }
                
                // Generate path along roads (horizontal or vertical movement only)
                const numWaypoints = 8;
                
                for (let j = 0; j < numWaypoints; j++) {
                    const moveDirection = Math.floor(seededRandom(carSeed + 10 + j) * 2); // 0 = horizontal, 1 = vertical
                    const distance = (Math.floor(seededRandom(carSeed + 20 + j) * 3) + 1) * roadSpacing;
                    const sign = seededRandom(carSeed + 30 + j) > 0.5 ? 1 : -1;
                    
                    if (moveDirection === 0) {
                        // Move horizontally
                        currentPos = { x: currentPos.x + distance * sign, z: currentPos.z };
                    } else {
                        // Move vertically
                        currentPos = { x: currentPos.x, z: currentPos.z + distance * sign };
                    }
                    waypoints.push({ x: currentPos.x, z: currentPos.z });
                }
                
                createCar(carColor, function(aiCar) {
                    const laneOffset = seededRandom(carSeed + 40) > 0.5 ? 5 : -5;
                    aiCar.position.set(waypoints[0].x, 0.5, waypoints[0].z);
                    chunkGroup.add(aiCar);
                    aiCars.push({
                        mesh: aiCar,
                        speed: 0.06 + seededRandom(carSeed + 5) * 0.08,
                        pathIndex: 0,
                        waypoints: waypoints,
                        distanceToWaypoint: 0,
                        laneOffset: laneOffset,
                        chunkKey: chunkKey
                    });
                });
            }
            
            scene.add(chunkGroup);
            loadedChunks.set(chunkKey, true);
            chunkObjects.set(chunkKey, chunkGroup);
        }

        function updateChunks(playerX, playerZ) {
            const playerChunk = getChunkCoords(playerX, playerZ);
            const loadRadius = Math.ceil(LOAD_DISTANCE / CHUNK_SIZE);
            
            // Generate new chunks near player
            for (let dx = -loadRadius; dx <= loadRadius; dx++) {
                for (let dz = -loadRadius; dz <= loadRadius; dz++) {
                    const chunkX = playerChunk.x + dx;
                    const chunkZ = playerChunk.z + dz;
                    generateChunk(chunkX, chunkZ);
                }
            }
            
            // Remove distant chunks
            const unloadRadius = Math.ceil(UNLOAD_DISTANCE / CHUNK_SIZE);
            for (const [key, _] of loadedChunks) {
                const coords = key.split(',').map(Number);
                const dx = Math.abs(coords[0] - playerChunk.x);
                const dz = Math.abs(coords[1] - playerChunk.z);
                
                if (dx > unloadRadius || dz > unloadRadius) {
                    const chunkGroup = chunkObjects.get(key);
                    scene.remove(chunkGroup);
                    loadedChunks.delete(key);
                    chunkObjects.delete(key);
                    
                    // Clean up pedestrians in this chunk
                    for (let i = pedestrians.length - 1; i >= 0; i--) {
                        const ped = pedestrians[i];
                        if (chunkGroup.children.includes(ped.mesh)) {
                            pedestrians.splice(i, 1);
                        }
                    }
                    
                    // Clean up AI cars in this chunk
                    for (let i = aiCars.length - 1; i >= 0; i--) {
                        const aiCar = aiCars[i];
                        if (aiCar.chunkKey === key) {
                            aiCars.splice(i, 1);
                        }
                    }
                    
                    // Clean up arrays
                    chunkGroup.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.dispose());
                            } else {
                                child.material.dispose();
                            }
                        }
                    });
                }
            }
        }

        // Car creation function
        function createCar(color, callback) {
            // Handle optional color parameter
            if (typeof color === 'function') {
                callback = color;
                color = null;
            }

            const mtlLoader = new THREE.MTLLoader();
            mtlLoader.load('car_long_red.mtl', 
                function(materials) {
                    console.log('MTL loaded successfully');
                    materials.preload();
                    const objLoader = new THREE.OBJLoader();
                    objLoader.setMaterials(materials);
                    objLoader.load('car_long_red.obj', 
                        function(object) {
                            console.log('OBJ loaded successfully');
                            object.scale.set(1.5, 1.5, 1.5);
                            object.position.y = 0.5;

                            // Apply color tint if provided
                            if (color) {
                                object.traverse(function(child) {
                                    if (child.isMesh) {
                                        if (Array.isArray(child.material)) {
                                            child.material.forEach(mat => {
                                                mat.color.setHex(color);
                                            });
                                        } else {
                                            child.material.color.setHex(color);
                                        }
                                    }
                                });
                            }

                            callback(object);
                        },
                        function(progress) {
                            console.log('OBJ loading progress:', progress.loaded / progress.total);
                        },
                        function(error) {
                            console.error('Error loading OBJ:', error);
                        }
                    );
                },
                function(progress) {
                    console.log('MTL loading progress:', progress.loaded / progress.total);
                },
                function(error) {
                    console.error('Error loading MTL:', error);
                }
            );
        }

        // Pedestrian creation function
        function createPedestrian() {
            const pedGroup = new THREE.Group();

            // Body
            const bodyGeom = new THREE.BoxGeometry(0.6, 1.5, 0.45);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); // blue shirt
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            pedGroup.add(body);

            // Head
            const headGeom = new THREE.SphereGeometry(0.3, 8, 8);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 1.05;
            pedGroup.add(head);

            // Arms
            const armGeom = new THREE.CylinderGeometry(0.075, 0.075, 0.9, 8);
            const armMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const leftArm = new THREE.Mesh(armGeom, armMat);
            leftArm.position.set(-0.45, 0.3, 0);
            leftArm.rotation.z = Math.PI / 6;
            pedGroup.add(leftArm);
            const rightArm = new THREE.Mesh(armGeom, armMat);
            rightArm.position.set(0.45, 0.3, 0);
            rightArm.rotation.z = -Math.PI / 6;
            pedGroup.add(rightArm);

            // Legs
            const legGeom = new THREE.CylinderGeometry(0.09, 0.09, 1.2, 8);
            const legMat = new THREE.MeshLambertMaterial({ color: 0x000000 }); // black pants
            const leftLeg = new THREE.Mesh(legGeom, legMat);
            leftLeg.position.set(-0.15, -0.9, 0);
            pedGroup.add(leftLeg);
            const rightLeg = new THREE.Mesh(legGeom, legMat);
            rightLeg.position.set(0.15, -0.9, 0);
            pedGroup.add(rightLeg);

            return pedGroup;
        }

        // Player car
        let car;
        createCar(function(loadedCar) {
            car = loadedCar;
            scene.add(car);
            
            // Initialize chunks around starting position
            updateChunks(0, 0);
        });

        // AI Cars
        const aiCars = [];

        // Controls
        let targetSpeed = 0;
        let targetRotation = 0;
        let currentSpeed = 0;
        let currentRotation = 0;
        const acceleration = 0.02;
        const rotAcceleration = 0.1;
        const maxSpeed = 0.5;
        let isFirstPerson = false;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fpsUpdateTime = 0;
        let killCount = 0;

        // Reset function
        function resetGame() {
            if (!car) return;
            
            // Reset player car
            car.position.set(0, 0.5, 0);
            car.rotation.set(0, 0, 0);
            targetSpeed = 0;
            targetRotation = 0;
            currentSpeed = 0;
            currentRotation = 0;
            
            // Reset kill counter
            killCount = 0;
            document.getElementById('kill-counter').textContent = 'Pedestrians Hit: 0';

            // Reset AI cars
            aiCars.forEach((aiCar) => {
                if (aiCar.waypoints && aiCar.waypoints.length > 0) {
                    aiCar.mesh.position.set(aiCar.waypoints[0].x, 0.5, aiCar.waypoints[0].z);
                    aiCar.mesh.rotation.set(0, 0, 0);
                    aiCar.pathIndex = 0;
                }
            });
        }

        // Add reset button listener
        document.getElementById('reset-button').addEventListener('click', resetGame);

        // First person toggle
        document.getElementById('view-toggle').addEventListener('click', function() {
            isFirstPerson = !isFirstPerson;
            if (car) car.visible = !isFirstPerson;
            this.textContent = isFirstPerson ? '3RD PERSON' : '1ST PERSON';
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') {
                targetSpeed = maxSpeed;
            } else if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') {
                targetSpeed = -maxSpeed;
            } else if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
                targetRotation = 0.05;
            } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                targetRotation = -0.05;
            } else if (event.key === 'p' || event.key === 'P') {
                isFirstPerson = !isFirstPerson;
                if (car) car.visible = !isFirstPerson;
                document.getElementById('view-toggle').textContent = isFirstPerson ? '3RD PERSON' : '1ST PERSON';
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W' || 
                event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') {
                targetSpeed = 0;
            } else if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A' || 
                       event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                targetRotation = 0;
            }
        });

        // Touch controls
        const buttons = {
            forward: document.getElementById('btn-forward'),
            backward: document.getElementById('btn-backward'),
            left: document.getElementById('btn-left'),
            right: document.getElementById('btn-right')
        };

        function setupTouchButton(button, onStart, onEnd) {
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                onStart();
            });
            button.addEventListener('touchend', (e) => {
                e.preventDefault();
                onEnd();
            });
            button.addEventListener('mousedown', onStart);
            button.addEventListener('mouseup', onEnd);
            button.addEventListener('mouseleave', onEnd);
        }

        setupTouchButton(
            buttons.forward,
            () => { targetSpeed = maxSpeed; },
            () => { targetSpeed = 0; }
        );
        setupTouchButton(
            buttons.backward,
            () => { targetSpeed = -maxSpeed; },
            () => { targetSpeed = 0; }
        );
        setupTouchButton(
            buttons.left,
            () => { targetRotation = 0.05; },
            () => { targetRotation = 0; }
        );
        setupTouchButton(
            buttons.right,
            () => { targetRotation = -0.05; },
            () => { targetRotation = 0; }
        );

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Calculate FPS
            const currentTime = performance.now();
            const deltaTime = currentTime - lastFrameTime;
            lastFrameTime = currentTime;
            frameCount++;
            fpsUpdateTime += deltaTime;
            
            if (fpsUpdateTime >= 500) {
                const fps = Math.round((frameCount * 1000) / fpsUpdateTime);
                document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                frameCount = 0;
                fpsUpdateTime = 0;
            }

            if (!car) return;

            // Update chunks based on player position
            updateChunks(car.position.x, car.position.z);

            // Update current speed and rotation
            currentSpeed += (targetSpeed - currentSpeed) * acceleration;
            currentRotation += (targetRotation - currentRotation) * rotAcceleration;

            // Update car rotation
            car.rotation.y += currentRotation;

            // Move the car based on its rotation
            const moveX = Math.sin(car.rotation.y) * currentSpeed;
            const moveZ = Math.cos(car.rotation.y) * currentSpeed;
            car.position.x += moveX;
            car.position.z += moveZ;

            // Collision detection
            const carBox = new THREE.Box3().setFromObject(car);
            let collided = false;
            for (let tree of trees) {
                const treeBox = new THREE.Box3().setFromObject(tree);
                if (carBox.intersectsBox(treeBox)) {
                    collided = true;
                    break;
                }
            }
            if (!collided) {
                for (let building of buildings) {
                    const buildingBox = new THREE.Box3().setFromObject(building);
                    if (carBox.intersectsBox(buildingBox)) {
                        collided = true;
                        break;
                    }
                }
            }
            if (!collided) {
                for (let aiCar of aiCars) {
                    const aiBox = new THREE.Box3().setFromObject(aiCar.mesh);
                    if (carBox.intersectsBox(aiBox)) {
                        collided = true;
                        break;
                    }
                }
            }
            if (!collided) {
                for (let i = pedestrians.length - 1; i >= 0; i--) {
                    const ped = pedestrians[i];
                    const pedBox = new THREE.Box3().setFromObject(ped.mesh);
                    if (carBox.intersectsBox(pedBox)) {
                        collided = true;
                        // Remove pedestrian from its parent (chunkGroup)
                        if (ped.mesh.parent) {
                            ped.mesh.parent.remove(ped.mesh);
                        }
                        pedestrians.splice(i, 1);
                        // Increment kill counter
                        killCount++;
                        document.getElementById('kill-counter').textContent = 'Pedestrians Hit: ' + killCount;
                        // Flash red
                        const redFlash = document.getElementById('red-flash');
                        redFlash.style.opacity = '1';
                        setTimeout(() => {
                            redFlash.style.opacity = '0';
                        }, 150);
                        break;
                    }
                }
            }
            if (collided) {
                car.position.x -= moveX;
                car.position.z -= moveZ;
                currentSpeed = 0;
            }

            // Update camera position to follow the car
            if (isFirstPerson) {
                // First person view - positioned as if sitting in driver's seat
                const driverOffsetX = Math.sin(car.rotation.y) * 0.3;
                const driverOffsetZ = Math.cos(car.rotation.y) * 0.3;
                camera.position.x = car.position.x + driverOffsetX;
                camera.position.z = car.position.z + driverOffsetZ;
                camera.position.y = car.position.y + 1.2;
                
                // Look ahead in the direction of movement
                const lookAheadDistance = 8;
                const lookX = car.position.x + Math.sin(car.rotation.y) * lookAheadDistance;
                const lookZ = car.position.z + Math.cos(car.rotation.y) * lookAheadDistance;
                camera.lookAt(lookX, car.position.y + 0.8, lookZ);
            } else {
                // Third person view
                const offset = 10;
                camera.position.x = car.position.x;
                camera.position.z = car.position.z - offset;
                camera.position.y = 10;
                camera.lookAt(car.position);
            }

            // Update AI cars
            aiCars.forEach(aiCar => {
                const currentWaypoint = aiCar.waypoints[aiCar.pathIndex];
                const nextWaypoint = aiCar.waypoints[(aiCar.pathIndex + 1) % aiCar.waypoints.length];
                
                // Calculate target position with lane offset
                let targetX = nextWaypoint.x;
                let targetZ = nextWaypoint.z;
                
                // Apply lane offset based on travel direction
                const waypointDirX = nextWaypoint.x - currentWaypoint.x;
                const waypointDirZ = nextWaypoint.z - currentWaypoint.z;
                
                if (Math.abs(waypointDirX) > Math.abs(waypointDirZ)) {
                    // Mostly horizontal travel - offset in Z direction
                    targetZ += aiCar.laneOffset;
                } else {
                    // Mostly vertical travel - offset in X direction
                    targetX += aiCar.laneOffset;
                }
                
                const dirX = targetX - aiCar.mesh.position.x;
                const dirZ = targetZ - aiCar.mesh.position.z;
                const distance = Math.sqrt(dirX * dirX + dirZ * dirZ);
                
                if (distance < 2) {
                    aiCar.pathIndex = (aiCar.pathIndex + 1) % aiCar.waypoints.length;
                } else {
                    const normalizedDirX = dirX / distance;
                    const normalizedDirZ = dirZ / distance;
                    
                    aiCar.mesh.position.x += normalizedDirX * aiCar.speed;
                    aiCar.mesh.position.z += normalizedDirZ * aiCar.speed;
                    
                    // Rotate car to face direction of movement
                    aiCar.mesh.rotation.y = Math.atan2(normalizedDirX, normalizedDirZ);
                }
            });

            // Update pedestrians
            pedestrians.forEach(ped => {
                ped.mesh.position.x += ped.directionX * ped.speed;
                ped.mesh.position.z += ped.directionZ * ped.speed;
                if (ped.mesh.position.x < ped.minX || ped.mesh.position.x > ped.maxX) {
                    ped.directionX *= -1;
                }
                if (ped.mesh.position.z < ped.minZ || ped.mesh.position.z > ped.maxZ) {
                    ped.directionZ *= -1;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
